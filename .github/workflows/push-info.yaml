name: push-info

on:
  push:
    branches:
      - main
  schedule:
    - cron: "20 21 * * *" # UTC 时间 21 时 20 分，对应北京时间 早上 05:20

jobs:
  run-coupons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18.19.1"

      - name: Install Dependencies
        run: |
          npm install axios moment

      - name: Run Script
        run: node ./index.js
